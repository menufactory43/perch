name: Perch

options:
  bundleIdPrefix: com.fauconnier
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  PerchCore:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: AKMNXGVVGX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Perch:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/Perch
        excludes:
          - Info.plist
    dependencies:
      - package: PerchCore
        product: PerchCore
    info:
      path: Apps/Perch/Perch-Info.generated.plist
      properties:
        CFBundleName: Perch
        CFBundleDisplayName: Perch
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Perch"
        NSPrincipalClass: NSApplication
    entitlements:
      path: Apps/Perch/Perch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fauconnier.perch
        PRODUCT_NAME: Perch
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Perch:
    build:
      targets:
        Perch: all
    run:
      config: Debug
    archive:
      config: Release
